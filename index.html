<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Varsha 💖</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #ff758c, #ff7eb3, #ff4d6d, #ff9a9e);
      background-size: 400% 400%;
      animation: gradient 8s ease infinite;
      overflow: hidden;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      z-index: 2;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 25px;
      font-size: 26px;
    }

    button {
      padding: 14px 30px;
      font-size: 18px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      box-shadow: 0 0 20px #ff4d6d;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    #no {
      background: #ccc;
      position: absolute;
    }

    .hearts, .kisses {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .heart, .kiss {
      position: absolute;
      animation: float 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes float {
      0% { transform: translateY(100vh); opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    .love-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #ff4d6d, #ff9a9e);
      display: none;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 32px;
      text-align: center;
      z-index: 10;
      padding: 20px;
    }
  </style>
</head>

<body>

  <audio id="music">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <div class="hearts" id="hearts"></div>
  <div class="kisses" id="kisses"></div>

  <div class="card">
    <h1>Varsha 💖<br>Will you be my Valentine?</h1>
    <button id="yes" onclick="yesLove()">Yes 💖</button>
    <button id="no" onmouseover="moveNo()">No 💔</button>
  </div>

  <div class="love-screen" id="loveScreen">
    💖 Varsha, I love you so much 💖<br><br>
    Happy Valentine’s Day 😘😘
  </div>

  <script>
    function yesLove() {
      document.getElementById("loveScreen").style.display = "flex";
      document.getElementById("music").play();
      startKisses();
    }

    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // Floating hearts
    const hearts = document.getElementById("hearts");
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 15 + "px";
      hearts.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }, 400);

    // Kiss explosion after YES
    function startKisses() {
      const kisses = document.getElementById("kisses");
      setInterval(() => {
        const kiss = document.createElement("div");
        kiss.className = "kiss";
        kiss.innerHTML = "😘";
        kiss.style.left = Math.random() * 100 + "vw";
        kiss.style.fontSize = Math.random() * 25 + 20 + "px";
        kisses.appendChild(kiss);
        setTimeout(() => kiss.remove(), 6000);
      }, 300);
    }
  </script>

</body>
</html>
